; Limites PHP pour le site (lues par PHP-FPM chez OVH ; ignorées par WAMP en local, qui utilise son php.ini).
; Espace médias : 64 Mo par fichier côté module (app/config/espace-medias.php, max_upload_mb).
; Le proxy OVH plafonne de toute façon une requête vers 128 Mo, et max_execution_time n'est pas modifiable (165 s).
upload_max_filesize = 64M
post_max_size = 128M
max_file_uploads = 30
memory_limit = 256M
